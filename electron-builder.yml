appId: com.confucius.editor
productName: Confucius
directories:
  output: dist-release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
win:
  target: nsis
  icon: public/icon.ico
mac:
  target: dmg
  icon: public/icon.icns
linux:
  target: AppImage
  icon: public/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
