appId: com.confucius.editor
productName: Confucius
directories:
  output: dist-release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - public/**/*
win:
  target: nsis
  icon: build/icons/win/icon.ico
mac:
  target: dmg
  icon: build/icons/mac/icon.icns
linux:
  target: AppImage
  icon: build/icons/png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true