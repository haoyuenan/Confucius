appId: com.confucius.editor
productName: Confucius
compression: maximum
directories:
  output: dist-release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules"
extraResources:
  - from: plugins/builtins
    to: plugins/builtins
    filter:
      - "**/*"
      - "!**/*.md"
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icons/win/icon.ico
mac:
  target: dmg
  icon: build/icons/mac/icon.icns
linux:
  target: AppImage
  icon: build/icons/png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true