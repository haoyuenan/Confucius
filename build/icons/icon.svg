<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8832c"/>
      <stop offset="100%" stop-color="#7a4e10"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形背景 — 暖琥珀渐变 -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- 白色文档底板 -->
  <rect x="112" y="80" width="288" height="352" rx="22" fill="#fff" opacity="0.93"/>

  <!-- 折角 (右上) -->
  <polygon points="336,80 400,80 400,144" fill="#f5e6cc" opacity="0.9"/>
  <polyline points="336,80 336,144 400,144" fill="none" stroke="#d4a860" stroke-width="3"/>

  <!-- 正文行（暗示 Markdown 内容） -->
  <!-- H1 行（粗，带 # 感） -->
  <rect x="144" y="136" width="30" height="11" rx="5" fill="#c8832c" opacity="0.55"/>
  <rect x="182" y="136" width="120" height="11" rx="5" fill="#c8832c" opacity="0.55"/>

  <!-- 普通段落行 -->
  <rect x="144" y="166" width="192" height="9" rx="4.5" fill="#c8832c" opacity="0.3"/>
  <rect x="144" y="188" width="174" height="9" rx="4.5" fill="#c8832c" opacity="0.3"/>

  <!-- 分隔线 -->
  <line x1="144" y1="212" x2="368" y2="212" stroke="#d4a860" stroke-width="2" opacity="0.4"/>

  <!-- M↓ Markdown 徽标 — 主视觉元素 -->
  <!-- M 字形 -->
  <path d="
    M 138 240
    L 138 334
    L 168 334
    L 168 290
    L 204 326
    L 240 290
    L 240 334
    L 270 334
    L 270 240
    L 240 240
    L 204 278
    L 168 240
    Z"
    fill="#8b5010"/>

  <!-- ↓ 向下箭头 -->
  <line x1="316" y1="238" x2="316" y2="306"
        stroke="#8b5010" stroke-width="26" stroke-linecap="round"/>
  <polyline points="284,289 316,336 348,289"
            stroke="#8b5010" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round"
            fill="none"/>
</svg>
